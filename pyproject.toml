[project]
name = "sensorfm"
version = "0.1.0"
description = "Compact patch-based transformer foundation model for sensor time series, trained and deployed on free-tier compute."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6",
    "einops>=0.7",
    "typer>=0.12",
    "rich>=13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Pulled in only where needed so the local (disk-constrained) env stays small.
data = ["huggingface-hub>=0.23", "httpx>=0.27"]
track = ["mlflow>=2.12"]
eval = ["statsmodels>=0.14", "scikit-learn>=1.4"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "scipy-stubs", "types-pyyaml"]

[project.scripts]
sensorfm = "sensorfm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorfm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["N812", "N806", "N803", "N817"]  # F alias; math names (L, H, N) as in the paper notation

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
# nn.Module.__call__ is typed as returning Any; returning a submodule call is not a bug.
module = ["sensorfm.model.*", "sensorfm.pretrain.*", "sensorfm.utils.dist", "sensorfm.finetune.*"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["einops.*", "hydra.*", "omegaconf.*", "pyarrow.*", "matplotlib.*", "mlflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer integration tests (deselect with -m 'not slow')",
    "gpu: requires CUDA",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B008"]  # typer.Option in defaults is the typer idiom
