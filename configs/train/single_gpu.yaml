strategy: none          # none | ddp | fsdp
precision: fp32         # fp32 | fp16 | bf16  (Kaggle T4/P100: use fp16)
compile: false
micro_batch: 32
grad_accum: 1
max_steps: 1000
lr: 3.0e-4
warmup_steps: 100
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
num_workers: 0
log_every: 10
ckpt_every: 200
keep_last: 3
