# CPU debug run: tiny model, synthetic shards, < 2 min (CI).
strategy: none
precision: fp32
compile: false
fused_adamw: false
micro_batch: 16
grad_accum: 1
max_steps: 300
lr: 1.0e-3
warmup_steps: 10
min_lr_ratio: 0.1
weight_decay: 0.1
betas: [0.9, 0.95]
grad_clip: 1.0
num_workers: 0
pin_memory: false
log_every: 25
val_every: 100
val_batches: 4
ckpt_every: 100
keep_last: 2
device: cpu
stop_at_step: 0       # >0: checkpoint and exit after this step (schedule still uses max_steps)
