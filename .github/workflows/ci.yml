name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (CPU torch)
        run: |
          uv venv --python 3.11
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv sync --group dev --inexact
      - name: Lint
        run: make lint
      - name: Build debug shards
        run: make data-debug
      - name: Test (incl. slow crash-resume integration test)
        run: make test-all
      - name: Pretrain debug (CPU, tiny, synthetic)
        run: make pretrain-debug
